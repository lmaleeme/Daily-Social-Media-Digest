
name: Daily Social Media Digest

on:
  schedule:
    # Runs at 07:00 UTC, Monday-Friday.
    - cron: "0 7 * * 1-5"

  workflow_dispatch:
    inputs:
      test_mode:
        description: "Choose what to run"
        type: choice
        required: true
        default: full
        options:
          - full
          - email_test
          - linkedin_text_test
          - linkedin_banner_test

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install feedparser requests trafilatura pillow

      - name: Run digest script
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_AUTHOR_URN: ${{ secrets.LINKEDIN_AUTHOR_URN }}

          PUBLISHED_PAGE_URL: ${{ vars.PUBLISHED_PAGE_URL }}

          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}

          NUDGE_EMAIL_TO: ${{ secrets.NUDGE_EMAIL_TO }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}

          DIGEST_TEST_MODE: ${{ inputs.test_mode || 'full' }}

        run: python main.py

      - name: Commit updated digest page
        if: ${{ github.event_name == 'schedule' || inputs.test_mode == 'full' }}
        run: |
          git config user.name "digest-bot"
          git config user.email "digest-bot@users.noreply.github.com"
          git add docs/
          git diff --quiet && git diff --staged --quiet || git commit -m "Update daily digest"
          git push
