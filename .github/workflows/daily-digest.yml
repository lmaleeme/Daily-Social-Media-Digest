name: Daily Social Media Digest

on:
  schedule:
    # Two runs, Monday-Friday. Times are UTC; South Africa is UTC+2 all year.
    #   Early run:  04:17 UTC = 06:17 South Africa time
    #   Backup run: 06:17 UTC = 08:17 South Africa time (stands down if the early
    #               run already published, so it only matters when GitHub is late)
    # Odd minutes on purpose: GitHub is busiest at the top of the hour.
    - cron: "17 4 * * 1-5"
    - cron: "17 6 * * 1-5"
  workflow_dispatch:   # lets you trigger it manually from the Actions tab
    inputs:
      email_test_only:
        description: "Only send a test nudge email (no posts, no page update)"
        type: boolean
        default: false

permissions:
  contents: write

# Runs never overlap: if the backup starts while the early run is still going,
# it waits, then sees the post already went out and stands down.
concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install feedparser requests trafilatura pillow

      - name: Run digest script
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_AUTHOR_URN: ${{ secrets.LINKEDIN_AUTHOR_URN }}
          PUBLISHED_PAGE_URL: ${{ vars.PUBLISHED_PAGE_URL }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
          NUDGE_EMAIL_TO: ${{ secrets.NUDGE_EMAIL_TO }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NUDGE_TEST_ONLY: ${{ inputs.email_test_only }}
        run: python main.py

      - name: Commit updated digest page
        run: |
          git config user.name "digest-bot"
          git config user.email "digest-bot@users.noreply.github.com"
          git add docs/
          git diff --quiet && git diff --staged --quiet || git commit -m "Update daily digest"
          git push
